<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Corridor — Social License Leadership Story</title>
<style>
  :root{
    --bg:#14161a; --panel:#1d2026; --card:#23272e; --ink:#f2efe9; --muted:#9aa0a8; --line:#343942;
    --accent:#e08a4f; --accent2:#5cc2b5; --good:#45b39d; --warn:#e0a83a; --bad:#e05a4f;
    --D:#e07a3f; --I:#2fb3a3; --S:#8f7fe0; --A:#5b8fd6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
  .wrap{max-width:640px;margin:0 auto;padding:12px 12px 48px}
  header.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
  .brand{font-weight:800;letter-spacing:.14em;color:var(--accent);font-size:13px}
  .day{font-size:12.5px;color:var(--muted)}
  .meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .meter label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:6px;background:#2c3038;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px;transition:width .8s ease,background .8s}

  /* stage */
  .stage{position:relative;border-radius:16px;overflow:hidden;background:#0c0d10;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .artbox{position:relative;aspect-ratio:16/10;overflow:hidden;background:#000}
  .stage svg.art{position:absolute;inset:0;width:100%;height:100%;animation:kb 18s ease-in-out infinite alternate;transform-origin:50% 60%}
  @keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.10) translate(-2%,-1%)}}
  .scene-tag{position:absolute;left:12px;top:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.04em}
  .ctrls{position:absolute;right:8px;top:8px;display:flex;gap:6px}
  .ctrls button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;font-size:15px}
  .caption{position:relative;padding:12px 14px 14px;background:#0c0d10;display:flex;gap:12px;align-items:flex-start;min-height:104px}
  .caption .pt{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.8);background:#333}
  .caption .pt svg{width:100%;height:100%}
  .caption .spk{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
  .caption .words{font-size:17px;line-height:1.35;font-weight:500}
  .caption .words span{opacity:.0;transition:opacity .12s}
  .caption .words span.on{opacity:1}
  .speaking .mouth{animation:talk .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.3)}}
  .progress{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0;transition:width .3s;z-index:2}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
  .opts{display:grid;gap:9px}
  button.opt{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15.5px;transition:transform .15s,border-color .15s;opacity:0;transform:translateY(8px)}
  button.opt.in{opacity:1;transform:none;transition:opacity .35s,transform .35s,border-color .15s}
  button.opt:hover{border-color:var(--accent)}
  button.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#1b1b1b;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:800}
  button.opt.dim{opacity:.3}
  button.opt.pick{border-color:var(--accent);background:#2c2620}
  .prompt{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600;letter-spacing:.03em}
  .ask{all:unset;cursor:pointer;font-size:14px;color:var(--accent2);font-weight:700;padding:10px 2px 0;display:inline-block}
  .btn{all:unset;cursor:pointer;display:inline-block;background:var(--accent);color:#1b1b1b;padding:12px 22px;border-radius:10px;font-weight:800;font-size:15px;margin-top:12px}
  .btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .waiting{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:bl 1s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes bl{50%{opacity:.2}}
  table.data{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 12px}
  table.data th,table.data td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
  table.data th{font-size:11.5px;color:var(--muted);font-weight:700}
  .late{color:var(--bad);font-weight:700}.ok{color:var(--good);font-weight:700}
  .alloc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .alloc-row .lbl{font-size:15px}.alloc-row .lbl small{display:block;color:var(--muted);font-size:12.5px}
  .stepper{display:flex;align-items:center;gap:8px;flex:none}
  .stepper button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);text-align:center;line-height:32px;font-size:18px;font-weight:700}
  .stepper span{width:22px;text-align:center;font-weight:800;font-size:17px}
  .remain{font-size:14px;color:var(--muted);margin-top:8px}

  .intro h1{font-size:30px;margin:14px 0 6px;line-height:1.15}
  .intro p{font-size:16px;color:#d9d5ce}
  .pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;background:#2c3038;color:var(--muted);margin-right:6px}
  .tabs{display:flex;gap:6px;margin:4px 0 12px}
  .tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:20px;font-size:14px;font-weight:700;border:1.5px solid var(--line)}
  .tabs button.on{background:var(--ink);color:#111;border-color:var(--ink)}
  h2{font-size:20px;margin:18px 0 8px}
  h3{font-size:13px;margin:18px 0 6px;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em}
  .story{font-size:16px}
  .stylebar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 0}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .comp{margin:10px 0}
  .comp .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
  .comp .track{position:relative;height:10px;background:#2c3038;border-radius:6px}
  .comp .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
  .comp .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .fit{display:flex;align-items:center;gap:16px;margin:6px 0 4px}
  .fit .num{font-size:44px;font-weight:800;line-height:1}
  .fit .lbl{font-size:14px;color:var(--muted)}
  ul.flags{padding-left:18px;margin:6px 0}
  ul.flags li{margin:6px 0;font-size:14.5px}
  .flag-red{color:var(--bad)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
  table.log{width:100%;border-collapse:collapse;font-size:13px}
  table.log td,table.log th{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
  table.log th{color:var(--muted);font-weight:600;font-size:12px}
  .note{font-size:12.5px;color:var(--muted);margin-top:14px}
  .fade{animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* svg animations */
  .drive{animation:drive 14s linear infinite}
  .drive2{animation:drive 14s linear infinite;animation-delay:-7s}
  @keyframes drive{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
  .dust{animation:dust 4s ease-out infinite;opacity:0}
  @keyframes dust{0%{opacity:.0;transform:translate(0,0) scale(.6)}20%{opacity:.55}100%{opacity:0;transform:translate(-40px,-18px) scale(1.8)}}
  .bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
  @keyframes bob{50%{transform:translateY(-2px)}}
  .flick{animation:flick .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes flick{from{transform:scaleY(.85) skewX(-4deg)}to{transform:scaleY(1.15) skewX(4deg)}}
  .smoke{animation:smoke 6s linear infinite;opacity:0}
  @keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.6}100%{opacity:0;transform:translate(30px,-120px) scale(2.6)}}
  .ring{animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
  @keyframes ring{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
  .shake{animation:shake .6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
  .blink{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  .siren{animation:siren .5s steps(2) infinite}
  @keyframes siren{0%{fill:#e0443b}50%{fill:#3b7be0}}
  .wave{animation:wave 2s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}
  @keyframes wave{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
  .twinkle{animation:blink 2.5s ease-in-out infinite}
  .glow{animation:glow 1.8s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:.4}to{opacity:1}}
  .pop{animation:pop 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
  @keyframes pop{0%{opacity:0;transform:scale(.4)}15%,70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
  .water{animation:water 2s linear infinite}
  @keyframes water{to{stroke-dashoffset:-40}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =====================================================================
   ART — inline SVG illustrations (no external images)
   ===================================================================== */
const W=400,H=250;
function sky(t){
  const g={day:["#7fb6e0","#f4dcb4"],dusk:["#3a3f6b","#f08a5d"],night:["#070d1c","#1e2a48"],indoor:["#5a4636","#3c2f25"]}[t];
  let s=`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset="1" stop-color="${g[1]}"/></linearGradient>
  <radialGradient id="fireg"><stop offset="0" stop-color="#ffd36b"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></radialGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#sk)"/>`;
  if(t==="night"){ for(let i=0;i<40;i++){const x=(i*97)%W,y=(i*53)%110; s+=`<circle cx="${x}" cy="${y}" r="${i%3?0.8:1.3}" fill="#fff" class="twinkle" style="animation-delay:${(i%7)*.3}s"/>`;}
    s+=`<circle cx="330" cy="40" r="14" fill="#f4efd8"/><circle cx="336" cy="36" r="13" fill="#0b1326"/>`; }
  if(t==="day") s+=`<circle cx="330" cy="46" r="18" fill="#fff4cf" opacity=".9"/>`;
  if(t==="dusk") s+=`<circle cx="300" cy="150" r="26" fill="#ffc27a" opacity=".85"/>`;
  return s;
}
function mountains(t){
  const far = t==="night"?"#1b2540":t==="dusk"?"#5b4a6e":"#8aa0b8";
  const near= t==="night"?"#121a30":t==="dusk"?"#3f3550":"#6d7f6a";
  const snow= t==="night"?"#8a95b0":"#ffffff";
  return `<polygon points="0,150 40,95 70,120 120,60 170,115 210,80 260,130 310,70 360,120 400,90 400,250 0,250" fill="${far}"/>
  <polygon points="120,60 108,78 120,74 132,82" fill="${snow}"/><polygon points="310,70 298,88 310,84 322,92" fill="${snow}"/>
  <polygon points="0,180 60,130 110,160 170,120 230,165 290,135 350,170 400,145 400,250 0,250" fill="${near}"/>`;
}
function ground(t){ const c=t==="night"?"#2a2a2e":t==="dusk"?"#6b5240":"#a98a5e"; return `<rect y="185" width="${W}" height="${H}" fill="${c}"/>`; }
function road(t){ const c=t==="night"?"#4a443c":"#cfae74"; return `<path d="M-10,250 C 120,215 180,205 230,192 C 270,182 320,180 410,176 L410,190 C 330,194 280,198 245,206 C 200,218 150,232 60,250 Z" fill="${c}"/>`; }
function truck(x,y,s=1,cls="",color="#e8b33a"){
  return `<g class="${cls}"><g transform="translate(${x},${y}) scale(${s})">
    <rect x="0" y="-22" width="44" height="18" rx="2" fill="${color}"/><path d="M44,-18 h12 l8,8 v6 h-20z" fill="#d49a2a"/>
    <rect x="49" y="-16" width="7" height="6" fill="#bfe0f0"/><circle cx="10" cy="-3" r="5" fill="#222"/><circle cx="34" cy="-3" r="5" fill="#222"/><circle cx="56" cy="-3" r="5" fill="#222"/>
    <circle class="dust" cx="-6" cy="-6" r="7" fill="#e9d6b0"/><circle class="dust" style="animation-delay:1.3s" cx="-10" cy="-4" r="6" fill="#e9d6b0"/><circle class="dust" style="animation-delay:2.6s" cx="-4" cy="-8" r="8" fill="#e9d6b0"/>
  </g></g>`;
}
function stoppedTruck(x,y,s=1,lights=false){
  return `<g transform="translate(${x},${y}) scale(${s})"><rect x="0" y="-22" width="44" height="18" rx="2" fill="#c89a32"/><path d="M44,-18 h12 l8,8 v6 h-20z" fill="#b5852a"/><rect x="49" y="-16" width="7" height="6" fill="#9cc"/>
  <circle cx="10" cy="-3" r="5" fill="#222"/><circle cx="34" cy="-3" r="5" fill="#222"/><circle cx="56" cy="-3" r="5" fill="#222"/>
  ${lights?`<path d="M64,-10 L120,-22 L120,6 Z" fill="#fff7c0" opacity=".35" class="glow"/>`:""}</g>`;
}
function house(x,y,s=1){ return `<g transform="translate(${x},${y}) scale(${s})"><rect x="0" y="-18" width="30" height="18" fill="#c98f5f"/><polygon points="-3,-18 15,-30 33,-18" fill="#9e3b2a"/><rect x="11" y="-10" width="7" height="10" fill="#5a3a22"/><rect x="21" y="-14" width="5" height="5" fill="#f5d78e"/></g>`; }
const PAL=["#b5562b","#2a6f6a","#7b4ea8","#c9a227","#3c6fb0","#a83a50","#4f8a3c","#d07a2c"];
function person(x,y,s=1,c="#b5562b",o={}){
  let hat="";
  if(o.hat==="bowler") hat=`<ellipse cx="0" cy="-27" rx="8" ry="2" fill="#2b2b2b"/><rect x="-5" y="-34" width="10" height="7" rx="4" fill="#2b2b2b"/>`;
  if(o.hat==="helmet") hat=`<path d="M-7,-26 a7,7 0 0 1 14,0 z" fill="#f2f2f2"/>`;
  if(o.hat==="chullo") hat=`<path d="M-6,-27 a6,6 0 0 1 12,0 z" fill="#c23b5a"/>`;
  const arm = o.arm?`<path d="M5,-16 L14,-30" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`:"";
  return `<g class="${o.bob?"bob":""}" style="animation-delay:${o.d||0}s"><g transform="translate(${x},${y}) scale(${s})">
    <path d="M-7,0 L-6,-17 Q0,-21 6,-17 L7,0 Z" fill="${c}"/>${arm}<circle cx="0" cy="-23" r="5.5" fill="#8a5a3c"/>${hat}</g></g>`;
}
function crowd(x,y,n,spread,s=1,opt={}){ let g=""; for(let i=0;i<n;i++){ const px=x+((i*37)%spread), py=y+((i*13)%10); g+=person(px,py,s*(0.85+((i*7)%4)*.06),PAL[i%PAL.length],{bob:true,d:(i%5)*.3,hat:i%4===0?"chullo":(i%5===1?"bowler":""),arm:opt.arms&&i%3===0}); } return g; }
function fire(x,y,s=1){ return `<g transform="translate(${x},${y}) scale(${s})"><circle cx="0" cy="-8" r="30" fill="url(#fireg)" class="glow"/>
  <ellipse cx="0" cy="0" rx="14" ry="5" fill="#111"/><ellipse cx="0" cy="-4" rx="12" ry="4" fill="#222"/>
  <path class="flick" d="M-9,-4 Q-6,-22 0,-30 Q4,-20 9,-4 Z" fill="#ff7a2b"/><path class="flick" style="animation-delay:.15s" d="M-5,-4 Q-2,-16 1,-22 Q4,-14 5,-4 Z" fill="#ffd36b"/>
  <circle class="smoke" cx="0" cy="-30" r="8" fill="#555"/><circle class="smoke" style="animation-delay:2s" cx="3" cy="-30" r="9" fill="#666"/><circle class="smoke" style="animation-delay:4s" cx="-3" cy="-30" r="7" fill="#4a4a4a"/></g>`; }
function rocks(x,y){ return `<g transform="translate(${x},${y})"><ellipse cx="0" cy="0" rx="9" ry="6" fill="#77706a"/><ellipse cx="14" cy="2" rx="7" ry="5" fill="#8a837c"/><ellipse cx="26" cy="-1" rx="10" ry="6" fill="#6d665f"/><ellipse cx="40" cy="2" rx="8" ry="5" fill="#857e77"/></g>`; }
function room(wall="#6e5644",floor="#4a3a2e"){ return `<rect width="${W}" height="${H}" fill="${wall}"/><rect y="185" width="${W}" height="65" fill="${floor}"/>`; }
function windowView(x,y,w,h,t="day"){ return `<g><clipPath id="wv${x}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#wv${x})"><g transform="translate(${x},${y}) scale(${w/W},${h/H})">${sky(t)}${mountains(t)}${ground(t)}</g></g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#2a211a" stroke-width="5"/><line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y+h}" stroke="#2a211a" stroke-width="3"/></g>`; }
function pit(){ return `<g><ellipse cx="200" cy="215" rx="190" ry="40" fill="#8c6b4a"/><ellipse cx="200" cy="218" rx="150" ry="30" fill="#7a5c3f"/><ellipse cx="200" cy="221" rx="110" ry="21" fill="#684d34"/><ellipse cx="200" cy="224" rx="70" ry="12" fill="#563f2b"/></g>`; }
function phoneBig(x,y,label,sub){ return `<g transform="translate(${x},${y})"><circle class="ring" cx="45" cy="80" r="60" fill="none" stroke="#5cc2b5" stroke-width="3"/><circle class="ring" style="animation-delay:.8s" cx="45" cy="80" r="60" fill="none" stroke="#5cc2b5" stroke-width="3"/>
  <g class="shake"><rect x="0" y="0" width="90" height="160" rx="14" fill="#15171c" stroke="#555" stroke-width="2"/><rect x="6" y="14" width="78" height="132" rx="6" fill="#20324a"/>
  <text x="45" y="62" fill="#fff" font-size="10" text-anchor="middle" font-family="sans-serif" font-weight="700">${label}</text><text x="45" y="76" fill="#9fb3c8" font-size="7.5" text-anchor="middle" font-family="sans-serif">${sub}</text>
  <circle cx="25" cy="122" r="10" fill="#e0443b"/><circle cx="65" cy="122" r="10" fill="#45b39d" class="glow"/></g></g>`; }
function radioTower(x,y){ return `<g transform="translate(${x},${y})"><path d="M0,0 L10,-70 L20,0 M4,-25 L16,-25 M7,-48 L13,-48" stroke="#ccc" stroke-width="2.5" fill="none"/><circle cx="10" cy="-72" r="3" fill="#e0443b" class="blink"/>
  <circle class="wave" cx="10" cy="-72" r="20" fill="none" stroke="#fff" stroke-width="2"/><circle class="wave" style="animation-delay:.7s" cx="10" cy="-72" r="20" fill="none" stroke="#fff" stroke-width="2"/><circle class="wave" style="animation-delay:1.4s" cx="10" cy="-72" r="20" fill="none" stroke="#fff" stroke-width="2"/></g>`; }
function bubble(x,y,txt,d=0,c="#25d366"){ return `<g class="pop" style="animation-delay:${d}s"><rect x="${x}" y="${y}" width="${txt.length*5.2+16}" height="20" rx="10" fill="${c}"/><text x="${x+8}" y="${y+14}" font-size="9.5" fill="#062" font-family="sans-serif" font-weight="700">${txt}</text></g>`; }
function banner(x,y,txt){ return `<g transform="translate(${x},${y})" class="bob"><line x1="0" y1="0" x2="0" y2="-38" stroke="#5a3a22" stroke-width="2"/><line x1="60" y1="0" x2="60" y2="-38" stroke="#5a3a22" stroke-width="2"/><rect x="-2" y="-40" width="64" height="18" fill="#f3efe6"/><text x="30" y="-27" text-anchor="middle" font-size="10" font-weight="800" fill="#b5262b" font-family="sans-serif">${txt}</text></g>`; }
function tableLong(y=185){ return `<rect x="40" y="${y}" width="320" height="14" rx="3" fill="#5a3f2c"/><rect x="60" y="${y+14}" width="8" height="40" fill="#4a3324"/><rect x="332" y="${y+14}" width="8" height="40" fill="#4a3324"/>`; }

/* =====================================================================
   VOICE — browser text-to-speech, pre-scripted lines (no AI)
   ===================================================================== */
const TTS={on:true, ok:("speechSynthesis" in window), voices:[]};
function loadVoices(){ try{ TTS.voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); }catch(e){} }
if(TTS.ok){ loadVoices(); try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){} }
const FEM=/(female|samantha|victoria|karen|moira|tessa|serena|zira|susan|fiona|allison|ava|joanna|kendra|salli|libby|sonia|jenny|aria|emma|google us english)/i;
const MAL=/(male|daniel|alex|fred|david|mark|guy|tom|aaron|arthur|oliver|ryan|george|james|rishi|google uk english male)/i;
const VOICE={ nar:{g:"f",p:1,r:1}, rosa:{g:"f",p:.95,r:.92}, lucia:{g:"f",p:1.2,r:1.05}, carlos:{g:"m",p:.85,r:1.02}, vm:{g:"m",p:.95,r:.95}, adv:{g:"m",p:.75,r:.88}, board:{g:"m",p:.9,r:.95} };
const NAMES={nar:"Narrator",rosa:"Rosa · Ccollpa president",lucia:"Lucía · your community lead",carlos:"Carlos · VP Operations",vm:"Vice Minister",adv:"Community advisor",board:"The board"};
function pickVoice(g){
  const vs=TTS.voices; if(!vs.length) return null;
  const re=g==="f"?FEM:MAL; const m=vs.filter(v=>re.test(v.name)&&!(g==="f"&&MAL.test(v.name)&&!FEM.test(v.name)));
  return m[0]||vs[0];
}
let PLAY={token:0};
function stopAll(){ PLAY.token++; try{ if(TTS.ok) speechSynthesis.cancel(); }catch(e){} clearTimeout(PLAY.timer); clearInterval(PLAY.iv); }

function setCaption(who,text){
  const cap=document.getElementById("cap"); if(!cap) return [];
  const words=text.split(" ");
  cap.innerHTML=`<div class="pt">${portrait(who)}</div><div style="flex:1"><div class="spk">${NAMES[who]||""}</div><div class="words">${words.map(w=>`<span>${w}</span>`).join(" ")}</div></div>`;
  cap.classList.add("speaking");
  return [...cap.querySelectorAll(".words span")];
}
function revealAll(){ document.querySelectorAll("#cap .words span").forEach(s=>s.classList.add("on")); const c=document.getElementById("cap"); if(c) c.classList.remove("speaking"); }

function playLines(lines,onDone){
  stopAll(); const my=++PLAY.token; let i=0;
  const prog=document.getElementById("prog");
  const next=()=>{
    if(my!==PLAY.token) return;
    if(prog) prog.style.width=`${Math.round(i/lines.length*100)}%`;
    if(i>=lines.length){ const c=document.getElementById("cap"); if(c) c.classList.remove("speaking"); onDone&&onDone(); return; }
    const L=lines[i++]; const spans=setCaption(L.w,L.t);
    const words=L.t.split(" "); const est=words.length*330+600;
    const done=()=>{ if(my!==PLAY.token) return; clearTimeout(PLAY.timer); clearInterval(PLAY.iv); spans.forEach(s=>s.classList.add("on")); const c=document.getElementById("cap"); if(c) c.classList.remove("speaking"); PLAY.timer=setTimeout(next,450); };
    // timed word reveal (also the fallback when speech isn't available)
    let w=0; PLAY.iv=setInterval(()=>{ if(w<spans.length) spans[w++].classList.add("on"); },TTS.on&&TTS.ok?300:260);
    if(TTS.on && TTS.ok){
      try{
        const u=new SpeechSynthesisUtterance(L.t); const v=VOICE[L.w]||VOICE.nar; const vv=pickVoice(v.g);
        if(vv) u.voice=vv; u.lang="en-US"; u.pitch=v.p; u.rate=v.r;
        let cum=0; const starts=words.map(x=>{const s=cum; cum+=x.length+1; return s;});
        u.onboundary=(e)=>{ if(e.name&&e.name!=="word") return; const idx=starts.filter(s=>s<=e.charIndex).length; for(let k=0;k<idx&&k<spans.length;k++) spans[k].classList.add("on"); };
        u.onend=done; u.onerror=done;
        PLAY.timer=setTimeout(done, est*2.2+2500);
        setTimeout(()=>{ if(my===PLAY.token) speechSynthesis.speak(u); },60);
      }catch(e){ PLAY.timer=setTimeout(done,est); }
    } else { PLAY.timer=setTimeout(done,est); }
  };
  next();
}

/* =====================================================================
   ENGINE
   ===================================================================== */
const app=document.getElementById("app");
const meterColor=v=>v>=60?"var(--good)":v>=35?"var(--warn)":"var(--bad)";
function blockadeLost(day){ if(!S.set.blockade) return 0; const end=S.set.blockadeEnd||day; return Math.max(0,Math.min(day,end)-9); }
function shipNow(){ return clamp(S.ship-blockadeLost(S.day)*4); }
function metersHTML(){ const m=[["Community",S.trust],["Government",S.gov],["Shipments",shipNow()],["Team",S.morale]];
  return `<div class="meters" id="meters">${m.map(([l,v])=>`<div class="meter"><label>${l}</label><div class="bar"><i style="width:${v}%;background:${meterColor(v)}"></i></div></div>`).join("")}</div>`; }
function refreshMeters(){ const m=document.getElementById("meters"); if(m) m.outerHTML=metersHTML(); }

function intro(){
  app.innerHTML=`<div class="intro fade"><header class="top"><span class="brand">THE CORRIDOR</span></header>
   <div class="stage"><div class="artbox"><svg class="art" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${ART.s1()}</svg><div class="scene-tag">A story in 13 decisions</div></div></div>
   <span class="pill" style="margin-top:14px">Corporate Affairs &amp; Social License</span><span class="pill">~15 min</span><span class="pill">🔊 Sound on</span>
   <h1>A month on Peru's mining corridor</h1>
   <p>Watch each scene, listen to the people involved, then make the call <b>you</b> would really make. Every option has a cost.</p>
   <p style="color:var(--muted);font-size:14px">Turn your sound on. Subtitles are always shown. At the end you'll see your leadership profile.</p>
   <button class="btn" id="go">▶ Start</button></div>`;
  document.getElementById("go").onclick=()=>{
    if(TTS.ok){ try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); loadVoices(); }catch(e){} }
    S=newState(); render(); };
}

function stageHTML(sc){
  return `<div class="stage"><div class="artbox"><svg class="art" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${ART[sc.id](S)}</svg>
   <div class="scene-tag">${sc.tag}</div>
   <div class="ctrls"><button id="snd" title="Sound">${TTS.on?"🔊":"🔇"}</button><button id="rep" title="Replay">↻</button><button id="skp" title="Skip">⏭</button></div>
   <div class="progress" id="prog"></div></div><div class="caption" id="cap"></div></div>`;
}

function render(){
  if(S.idx>=SCENES.length) return results();
  const sc=SCENES[S.idx]; S.day=sc.day; S.infoShown=false;
  if(sc.info) S.infoAvail++;
  app.innerHTML=`<header class="top"><span class="brand">THE CORRIDOR</span><span class="day">Decision ${S.idx+1} of ${SCENES.length}</span></header>
    ${metersHTML()}<div class="fade">${stageHTML(sc)}</div>
    <div class="panel" id="panel"><div class="waiting"><span class="dots"><i></i><i></i><i></i></span> Listen to the scene…</div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
  bindCtrls(sc);
  playScene(sc);
}
function bindCtrls(sc){
  document.getElementById("snd").onclick=()=>{ TTS.on=!TTS.on; document.getElementById("snd").textContent=TTS.on?"🔊":"🔇"; if(!TTS.on) try{speechSynthesis.cancel();}catch(e){} };
  document.getElementById("rep").onclick=()=>{ if(S.locked) return; playScene(sc,true); };
  document.getElementById("skp").onclick=()=>{ stopAll(); revealAll(); const p=document.getElementById("prog"); if(p) p.style.width="100%"; if(!S.choicesShown) showChoices(sc); };
}
function playScene(sc,replay){
  S.choicesShown = !!replay && S.choicesShown;
  playLines(sc.lines(S),()=>{ if(!S.choicesShown) showChoices(sc); });
}

function showChoices(sc){
  S.choicesShown=true; S.locked=false; S.t0=performance.now();
  const panel=document.getElementById("panel");
  if(sc.type==="alloc"){ panel.innerHTML=allocHTML(sc); bindAlloc(sc); return; }
  const opts=sc.options(S);
  panel.innerHTML=`${sc.extra||""}<p class="prompt">WHAT DO YOU DO?</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${o.t}</span></button>`).join("")}</div>
    ${sc.info?`<button class="ask" id="ask">💬 Ask Lucía first</button>`:""}`;
  [...panel.querySelectorAll("button.opt")].forEach((b,i)=>{ setTimeout(()=>b.classList.add("in"),80+i*110); b.onclick=()=>choose(sc,opts,i); });
  const ask=document.getElementById("ask");
  if(ask) ask.onclick=()=>{ if(S.infoShown) return; S.infoShown=true; S.infoUsed++; ask.remove();
    const L=typeof sc.info==="function"?sc.info(S):sc.info; playLines([L],()=>{}); };
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function recordComp(cmap,allOpts){
  const keys=new Set(); allOpts.forEach(o=>Object.keys(o.c||{}).forEach(k=>keys.add(k)));
  keys.forEach(k=>{ const vals=allOpts.map(o=>(o.c&&o.c[k])||0);
    S.min[k]=(S.min[k]||0)+Math.min(...vals); S.max[k]=(S.max[k]||0)+Math.max(...vals); S.earned[k]=(S.earned[k]||0)+((cmap&&cmap[k])||0); });
}
function applyEff(e){ for(const k in e) S[k]=clamp((S[k]||0)+e[k]); }
function addStyle(s){ for(const k in s) S.style[k]+=s[k]; }

function choose(sc,opts,i){
  if(S.locked) return; S.locked=true;
  const o=opts[i]; const secs=(performance.now()-S.t0)/1000; S.times.push(secs);
  recordComp(o.c,opts); addStyle(o.s||{});
  applyEff(typeof o.eff==="function"?o.eff(S):(o.eff||{}));
  if(o.flag) S.flags[o.flag]=true; if(o.set) Object.assign(S.set,o.set);
  if(sc.id==="s8"&&S.set.paid) S.set.blockadeEnd=16;
  if(sc.id==="s11"&&!S.set.blockadeEnd) S.set.blockadeEnd=S.set.broad?19:22;
  S.log.push({day:sc.day,title:sc.tag.split("·")[1].trim(),choice:o.t,secs,info:S.infoShown});
  document.querySelectorAll("button.opt").forEach((b,j)=>{ b.classList.add(j===i?"pick":"dim"); b.style.pointerEvents="none"; });
  const ask=document.getElementById("ask"); if(ask) ask.remove();
  refreshMeters();
  const out=typeof o.out==="function"?o.out(S):o.out;
  const panel=document.getElementById("panel");
  panel.insertAdjacentHTML("beforeend",`<button class="btn" id="next" style="display:none">Continue ▸</button>`);
  document.querySelector(".stage").scrollIntoView({behavior:"smooth",block:"start"});
  playLines([N(out)],()=>{ const n=document.getElementById("next"); if(n){ n.style.display="inline-block"; n.scrollIntoView({behavior:"smooth",block:"nearest"}); } });
  setTimeout(()=>{ const n=document.getElementById("next"); if(n) n.style.display="inline-block"; },1200);
  document.getElementById("next").onclick=()=>{ stopAll(); S.idx++; render(); };
}

/* allocation */
function allocHTML(sc){
  return `<p class="prompt">SPLIT 10 POINTS FOR THE NEXT WEEK</p>${sc.buckets.map(b=>`<div class="alloc-row"><div class="lbl">${b.t}<small>${b.d}</small></div>
   <div class="stepper"><button data-k="${b.k}" data-d="-1">−</button><span id="v-${b.k}">0</span><button data-k="${b.k}" data-d="1">+</button></div></div>`).join("")}
   <div class="remain" id="remain">10 points left</div><button class="btn" id="confirm" disabled>Confirm plan</button>`;
}
function bindAlloc(sc){
  const v={dialogue:0,gov:0,comms:0,legal:0};
  const upd=()=>{ const used=Object.values(v).reduce((a,b)=>a+b,0); for(const k in v) document.getElementById("v-"+k).textContent=v[k];
    document.getElementById("remain").textContent=`${10-used} point${10-used===1?"":"s"} left`; document.getElementById("confirm").disabled=used!==10; };
  document.querySelectorAll(".stepper button").forEach(b=>b.onclick=()=>{ const k=b.dataset.k,d=+b.dataset.d; const used=Object.values(v).reduce((a,c)=>a+c,0);
    if(d>0&&used>=10) return; if(d<0&&v[k]<=0) return; v[k]+=d; upd(); });
  document.getElementById("confirm").onclick=()=>{
    if(S.locked) return; S.locked=true;
    const secs=(performance.now()-S.t0)/1000; S.times.push(secs); S.set.blockade=true;
    const spread=Object.values(v).filter(x=>x>0).length;
    const c={stakeholder:v.dialogue>=3?2:(v.dialogue>=1?1:0),strategic:spread>=3?2:(spread===2?1:0),integrity:v.comms>=2?1:0,safety:(v.legal>=1&&v.legal<=3)?1:0};
    const R={stakeholder:[0,2],strategic:[0,2],integrity:[0,1],safety:[0,1]};
    for(const k in c){ S.earned[k]=(S.earned[k]||0)+c[k]; S.min[k]=(S.min[k]||0)+R[k][0]; S.max[k]=(S.max[k]||0)+R[k][1]; }
    addStyle({I:v.dialogue/10,S:v.gov/10,A:v.comms/10,D:v.legal/10});
    if(v.legal>=5) S.flags.legalHeavy=true; if(Math.max(...Object.values(v))>=7) S.flags.allInOne=true;
    applyEff({trust:Math.round(v.dialogue*1.5+v.comms-Math.max(0,v.legal-3)*2),gov:v.gov*2});
    S.log.push({day:sc.day,title:"Blockade plan",choice:`Dialogue ${v.dialogue} · Government ${v.gov} · Comms ${v.comms} · Legal/security ${v.legal}`,secs,info:false});
    const out=v.dialogue>=3?"Your team spends the week on the ground. The communities notice who shows up.":v.legal>=5?"Lawyers file complaints. The communities see it as the mine choosing a fight.":"The plan is in motion. The blockade continues.";
    document.querySelectorAll(".stepper button").forEach(b=>b.style.pointerEvents="none"); document.getElementById("confirm").remove();
    refreshMeters();
    const panel=document.getElementById("panel"); panel.insertAdjacentHTML("beforeend",`<button class="btn" id="next" style="display:none">Continue ▸</button>`);
    document.getElementById("next").onclick=()=>{ stopAll(); S.idx++; render(); };
    document.querySelector(".stage").scrollIntoView({behavior:"smooth",block:"start"});
    playLines([N(out)],()=>{ const n=document.getElementById("next"); if(n) n.style.display="inline-block"; });
    setTimeout(()=>{ const n=document.getElementById("next"); if(n) n.style.display="inline-block"; },1200);
  };
}

/* =====================================================================
   RESULTS
   ===================================================================== */
const FLAGS={
  promise:["Committed to jobs before checking whether operations could deliver them.","How do they handle pressure to promise more than they can deliver?"],
  promise2:["Kept repeating an undeliverable promise instead of correcting it.","Ask about a time they had to walk back a commitment."],
  force:["Leaned toward police or force to resolve a social conflict.","When do they think force is acceptable, and what did they learn from past cases?"],
  riskConvoy:["Kept convoys running during a regional strike, putting drivers at risk.","How do they weigh production against people's safety?"],
  paid:["Agreed to an informal payment to community leaders.","Serious integrity concern. Probe directly and check references."],
  blame:["Publicly blamed protesters after a person was injured.","How do they communicate in a crisis when the company may be at fault?"],
  broad:["Signed a broad, unfunded agreement under time pressure.","Commitment discipline: how do they make sure agreements can be kept?"],
  burnout:["Kept an exhausted, threatened team member in the field.","How do they look after their team's wellbeing under pressure?"],
  legalHeavy:["Put most effort into legal and security measures over dialogue.","What's their default playbook in a conflict?"],
  allInOne:["Put almost everything into one area during the blockade.","How do they balance several fronts at once?"],
  blameOps:["Blamed another department for their own over-promise.","Accountability: ask for an example of owning a mistake publicly."],
  noInfo:["Never asked the team for more information before deciding.","Decisive, or acting without enough input?"],
  fast:["Decided very fast (average under 4 seconds after the options appeared).","Were they reading carefully? Check depth in the interview."]
};
function compute(){
  const score={};
  for(const k in COMP){ const mn=S.min[k]||0,mx=S.max[k]||0,e=S.earned[k]||0; score[k]=mx>mn?Math.round(clamp((e-mn)/(mx-mn)*100)):50; }
  // fit: shortfalls below target are penalized more than linearly
  let wsum=0,fsum=0; for(const k in TARGET){ wsum+=TARGET[k]; const r=Math.min(1,score[k]/TARGET[k]); fsum+=TARGET[k]*r*r; }
  const fit=Math.round(fsum/wsum*100);
  const avg=S.times.reduce((a,b)=>a+b,0)/S.times.length;
  if(S.infoUsed===0&&S.infoAvail>0) S.flags.noInfo=true; if(avg<4) S.flags.fast=true;
  const tot=Object.values(S.style).reduce((a,b)=>a+b,0)||1;
  const styleP=Object.fromEntries(Object.entries(S.style).map(([k,v])=>[k,Math.round(v/tot*100)]));
  const order=Object.entries(styleP).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const balanced=styleP[order[0]]-styleP[order[1]]<=5;
  return {score,fit,avg,styleP,order,balanced,lost:blockadeLost(30)};
}
function storyEnding(R){
  const p=[`The road was blocked for <b>${R.lost} days</b>, about <b>US$${R.lost*4}M</b> in delayed sales.`];
  if(S.set.cleared) p.push("The forced clearance moved the blockade instead of ending it, and three people were hurt.");
  if(S.set.paid) p.push("The secret payment opened the road early, then leaked and damaged trust with the communities and the government.");
  if(S.set.broad) p.push("Six months later, 7 of the 18 commitments are already late, and a new blockade is being threatened.");
  else if(!S.set.paid) p.push("Six months later, the 8 funded commitments are on track, and Ccollpa defends the agreement to its neighbors.");
  p.push(S.trust>=60?"Community trust ended <b>strong</b>.":S.trust>=35?"Community trust ended <b>fragile</b>.":"Community trust ended <b>broken</b>.");
  return p.join(" ");
}
function results(){
  stopAll();
  const R=compute(); const top3=Object.entries(R.score).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const flags=Object.keys(S.flags).filter(f=>FLAGS[f]); const strengths=Object.entries(R.score).filter(([,v])=>v>=80).map(([k])=>COMP[k]);
  const dom=STYLES[R.order[0]],sec=STYLES[R.order[1]];
  const styleTitle=R.balanced?`${dom.name} + ${sec.name}<span style="color:var(--muted);font-weight:500;font-size:18px"> (balanced)</span>`:`${dom.name}<span style="color:var(--muted);font-weight:500;font-size:18px"> with ${sec.name} energy</span>`;
  app.innerHTML=`<header class="top"><span class="brand">THE CORRIDOR</span><span class="day">Complete</span></header>
  <div class="stage"><div class="artbox" style="aspect-ratio:16/7"><svg class="art" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${S.trust>=50?ART.s1(S):ART.s5(S)}</svg><div class="scene-tag">Day 30 · Your month is over</div></div></div>
  <div class="tabs" style="margin-top:12px"><button class="on" data-t="c">Your profile</button><button data-t="h">Recruiter report</button></div>
  <div id="tab-c" class="panel fade" style="margin-top:0">
    <h3 style="margin-top:2px">Your leadership style</h3>
    <h1 style="font-size:28px;margin:4px 0">${styleTitle}</h1>
    <div class="stylebar">${R.order.map(k=>`<div style="width:${R.styleP[k]}%;background:${STYLES[k].color}"></div>`).join("")}</div>
    <div class="legend">${R.order.map(k=>`<span><i style="background:${STYLES[k].color}"></i>${STYLES[k].name} ${R.styleP[k]}%</span>`).join("")}</div>
    <p class="story" style="margin-top:12px">${dom.desc} ${sec.desc.replace("You ","You also ")}</p>
    <h3>Where you stood out</h3><ul class="flags">${top3.map(([k])=>`<li>${COMP[k]}</li>`).join("")}</ul>
    <h3>How your month ended</h3><p class="story">${storyEnding(R)}</p>
    <button class="btn secondary" id="again">Play again (some events change)</button>
  </div>
  <div id="tab-h" class="panel fade" style="display:none;margin-top:0">
    <h3 style="margin-top:2px">Recruiter report · Corporate Affairs &amp; Social License</h3>
    <div class="fit"><div class="num" style="color:${R.fit>=80?"var(--good)":R.fit>=60?"var(--warn)":"var(--bad)"}">${R.fit}%</div><div class="lbl">Match to the target profile for this role domain.<br>An input for the interview, not a decision.</div></div>
    <h3>Competencies vs. target</h3>
    ${Object.keys(TARGET).map(k=>{const v=R.score[k];return `<div class="comp"><div class="row"><span>${COMP[k]}</span><b>${v}</b></div><div class="track"><div class="fill" style="width:${v}%;background:${v>=TARGET[k]?"var(--good)":v>=TARGET[k]-20?"var(--warn)":"var(--bad)"}"></div><div class="tgt" style="left:${TARGET[k]}%"></div></div></div>`}).join("")}
    <p class="note" style="margin-top:4px">White line = target for this role domain.</p>
    <h3>Probe in the interview</h3>
    ${flags.length?`<ul class="flags">${flags.map(f=>`<li class="${f==="paid"?"flag-red":""}"><b>${FLAGS[f][0]}</b><br><span style="color:var(--muted)">${FLAGS[f][1]}</span></li>`).join("")}</ul>`:`<p class="story">No flags were raised.</p>`}
    ${strengths.length?`<h3>Strengths seen</h3><p class="story">${strengths.join(" · ")}</p>`:""}
    <h3>Behavior</h3>
    <div class="stats"><div class="stat"><b>${R.avg.toFixed(0)}s</b><span>avg per decision</span></div><div class="stat"><b>${S.infoUsed}/${S.infoAvail}</b><span>asked team first</span></div><div class="stat"><b>${R.lost}d</b><span>blockade length</span></div></div>
    <div class="legend" style="margin:6px 0 4px">Style: ${R.order.map(k=>`<span><i style="background:${STYLES[k].color}"></i>${STYLES[k].name} ${R.styleP[k]}%</span>`).join("")}</div>
    <h3>Decision log</h3>
    <table class="log"><tr><th>Day</th><th>Choice</th><th>Time</th></tr>${S.log.map(l=>`<tr><td>${l.day}</td><td><b>${l.title}</b><br>${l.choice}${l.info?` <span style="color:var(--accent2)">(asked team)</span>`:""}</td><td>${l.secs.toFixed(0)}s</td></tr>`).join("")}</table>
    <button class="btn" id="copy">Copy report</button> <button class="btn secondary" id="again2">Play again</button>
    <p class="note">Prototype v0.2. Scores aren't calibrated against real senior leaders yet. Voices use your device's built-in text-to-speech, so quality varies by phone.</p>
  </div>`;
  window.scrollTo({top:0});
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
    document.getElementById("tab-c").style.display=b.dataset.t==="c"?"":"none"; document.getElementById("tab-h").style.display=b.dataset.t==="h"?"":"none"; });
  const again=()=>{ S=newState(); render(); }; document.getElementById("again").onclick=again; document.getElementById("again2").onclick=again;
  document.getElementById("copy").onclick=async(ev)=>{
    const txt=[`THE CORRIDOR — Recruiter report (Corporate Affairs & Social License)`,`Match to target: ${R.fit}%`,`Style: ${R.order.map(k=>`${STYLES[k].name} ${R.styleP[k]}%`).join(", ")}`,``,`Competencies (score / target):`,...Object.keys(TARGET).map(k=>`- ${COMP[k]}: ${R.score[k]} / ${TARGET[k]}`),``,`Probe in the interview:`,...(flags.length?flags.map(f=>`- ${FLAGS[f][0]} → ${FLAGS[f][1]}`):["- None"]),``,`Behavior: avg ${R.avg.toFixed(0)}s per decision; asked team ${S.infoUsed}/${S.infoAvail}; blockade ${R.lost} days`,``,`Decision log:`,...S.log.map(l=>`Day ${l.day} – ${l.title}: ${l.choice} (${l.secs.toFixed(0)}s)`)].join("\n");
    try{ await navigator.clipboard.writeText(txt); ev.target.textContent="Copied"; }catch(e){ ev.target.textContent="Copy not allowed here"; }
  };
}
intro();
</script>
</body>
</html>
